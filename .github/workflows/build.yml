# PC Control Deck desktop app: tests + PyInstaller builds for Windows, macOS (arm64 + x86_64) and Linux.
# Releases: a push to main whose version (pcdeck_agent.__version__) has no GitHub Release yet publishes
# one from the same run, creating the tag vX.Y.Z (GITHUB_TOKEN: no second run). Bump the version, add
# its "## X.Y.Z" CHANGELOG section, push. Don't push tags by hand: that would build the commit twice.
name: build

on:
  push:
    branches: ["**"]
    paths: ["**", "!**.md", "!docs/**", "docs/CHANGELOG.md"]
  pull_request:
    paths: ["**", "!**.md", "!docs/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-${{ github.ref }}
  # main runs queue instead of cancelling each other: one may be publishing a release.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, name: windows-x64 }
          - { os: macos-latest, name: macos-arm64 }  # Apple Silicon; the macos-14 images are retired
          # macos-13 (the last x86_64 image) was retired by GitHub in Dec 2025; macos-15-intel replaces it.
          - { os: macos-15-intel, name: macos-x86_64 }
          - { os: ubuntu-22.04, name: linux-x86_64 }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: System libraries for Qt (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libfontconfig1 libdbus-1-3 libxkbcommon0 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1

      - name: Install
        run: |
          python -m venv .venv
          if [ "$RUNNER_OS" = "Windows" ]; then PY=.venv/Scripts/python.exe; else PY=.venv/bin/python; fi
          echo "PY=$PY" >> "$GITHUB_ENV"
          "$PY" -m pip install --disable-pip-version-check -e ".[dev]"
          echo "VERSION=$(PYTHONPATH=src "$PY" -c 'import pcdeck_agent; print(pcdeck_agent.__version__)')" >> "$GITHUB_ENV"

      - name: Tests
        env:
          PYTHONPATH: src
          QT_QPA_PLATFORM: offscreen
        run: '"$PY" -m pytest -q'

      - name: Build (Windows, PyInstaller + Inno Setup)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen  # icon rendering without a desktop session
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --version=6.7.1 -y --no-progress
          }
          & ./scripts/build-agent.ps1 -SkipTests
          if ($LASTEXITCODE -ne 0) { exit 1 }
          New-Item -ItemType Directory -Force dist/release | Out-Null
          Copy-Item dist/installer/*.exe dist/release/
          Compress-Archive -Path dist/PCControlDeck -DestinationPath "dist/release/PCControlDeck-$env:VERSION-windows-x64-portable.zip"

      - name: Build (macOS / Linux, PyInstaller)
        if: runner.os != 'Windows'
        env:
          SKIP_TESTS: "1"
          PYTHON: ${{ env.PY }}
        run: bash scripts/build-agent.sh

      - uses: actions/upload-artifact@v7
        with:
          name: pcdeck-agent-${{ matrix.name }}
          path: dist/release/*
          if-no-files-found: error

  release:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Unreleased version?
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          VER=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/pcdeck_agent/__init__.py)
          echo "tag=v$VER" >> "$GITHUB_OUTPUT"
          if gh release view "v$VER" > /dev/null 2>&1; then
            echo "v$VER is already released: nothing to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Release notes (CHANGELOG section of this version)
        if: steps.ver.outputs.publish == 'true'
        env:
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          VER="${TAG#v}"
          awk -v h="## $VER" 'index($0, h) == 1 && (length($0) == length(h) || substr($0, length(h) + 1, 1) == " ") {f = 1; next}
                               f && /^## / {exit} f' docs/CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "::error::docs/CHANGELOG.md has no '## $VER' section"; exit 1; fi
          # Changelog links are relative to docs/: make them absolute for the release page.
          sed -i "s#](adr/#](https://github.com/$GITHUB_REPOSITORY/blob/$TAG/docs/adr/#g" notes.md
          {
            echo
            echo "### Install"
            echo
            echo "Windows: \`PCControlDeck-Setup-$VER.exe\` (or the portable zip). Linux: \`PCControlDeck-$VER-linux-x86_64.tar.gz\` + \`./install.sh\`."
            echo "macOS: \`.dmg\` for Apple Silicon (\`arm64\`) or Intel (\`x86_64\`), unsigned: see the [README](https://github.com/$GITHUB_REPOSITORY#install) for the first launch."
          } >> notes.md
          cat notes.md

      - uses: actions/download-artifact@v8
        if: steps.ver.outputs.publish == 'true'
        with:
          pattern: pcdeck-agent-*
          path: assets
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        if: steps.ver.outputs.publish == 'true'
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: PC Control Deck ${{ steps.ver.outputs.tag }}
          body_path: notes.md
          files: assets/*
          generate_release_notes: true
